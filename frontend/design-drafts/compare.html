<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>llm-vil Sprite-Stacking Style Comparison</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #141822;
    --card: #1f2637;
    --border: #3a4664;
    --accent: #f6d365;
    --text: #eef2f8;
    --muted: #aab6cc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0;
    font-size: 1.35rem;
    color: var(--accent);
  }
  .sub {
    margin: 4px 0 0;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    background: var(--card);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .controls label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--text);
  }
  button {
    background: #2f3b56;
    color: var(--text);
    border: 1px solid #52638a;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #3d4d70; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(310px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card h2 {
    margin: 0;
    font-size: 1.1rem;
    color: var(--accent);
  }
  .card .meta {
    margin: 2px 0 0;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .stage-wrap {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #485678;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 320px;
    image-rendering: pixelated;
  }
  .sheets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .sheet-box {
    background: #151a26;
    border: 1px solid #2e3850;
    border-radius: 8px;
    padding: 6px;
    text-align: center;
  }
  .sheet-box span {
    display: block;
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .sheet-box img {
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>llm-vil Sprite-Stacking Style Drafts (Live 360° Turntable Comparison)</h1>
      <p class="sub">Symmetric (w-1)*0.5 rotation sampling • 1px post-stack outline • Nearest-neighbor integer scaling</p>
    </div>
    <div class="controls">
      <button id="togglePlay">Pause</button>
      <label>Angle <input id="angleSlider" type="range" min="0" max="359" value="25" /> <span id="angleVal">25°</span></label>
      <label>Pitch (Squash) <input id="squashSlider" type="range" min="55" max="100" value="75" /> <span id="squashVal">0.75</span></label>
      <label>Spacing <input id="spacingSlider" type="range" min="50" max="240" value="100" /> <span id="spacingVal">1.0x</span></label>
      <label>Zoom <input id="zoomSlider" type="range" min="3" max="7" value="5" /> <span id="zoomVal">5x</span></label>
    </div>
  </header>

  <div class="grid" id="cardsGrid"></div>

let playing = true;
let angleDeg = 25;
let squash = 0.75;
let spacing = 1.0;
let zoom = 5;

const grid = document.getElementById("cardsGrid");
const stages = [];

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function extractSlices(img, count, w, h) {
  if (img.width % count !== 0 || img.width / count !== w) {
    throw new Error(`Strip width ${img.width} does not match ${count} * ${w}`);
  }
  const c = document.createElement("canvas");
  c.width = img.width;
  c.height = img.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const slices = [];
  for (let z = 0; z < count; z++) {
    slices.push(ctx.getImageData(z * w, 0, w, h).data);
  }
  return slices;
}

function renderStackToBuffer(slices, w, h, turnRad, sq, sp) {
  const count = slices.length;
  const diag = Math.ceil(Math.hypot(w, h)) + 8;
  const liftMax = Math.ceil((count - 1) * sp);
  const bw = diag + 12;
  const bh = Math.ceil(diag * sq) + liftMax + 16;
  const cx = bw >> 1;
  const baseY = bh - Math.ceil(diag * sq * 0.5) - 6;

  const ca = Math.cos(turnRad);
  const sa = Math.sin(turnRad);
  const body = new Uint8ClampedArray(bw * bh * 4);
  const out = new Uint8ClampedArray(bw * bh * 4);

  // Ground shadow at z=0
  const s0 = slices[0];
  for (let py = 0; py < bh; py++) {
    const dy = (py - (baseY + 2)) / sq;
    for (let px = 0; px < bw; px++) {
      const dx = px - (cx + 2);
      const sx = Math.round(dx * ca + dy * sa + (w - 1) * 0.5);
      const sy = Math.round(-dx * sa + dy * ca + (h - 1) * 0.5);
      if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
        const si = (sy * w + sx) * 4;
        if (s0[si + 3] > 0) {
          const oi = (py * bw + px) * 4;
          out[oi] = 28; out[oi + 1] = 38; out[oi + 2] = 34; out[oi + 3] = 95;
        }
      }
    }
  }

  // Stack slices bottom to top with symmetric (w-1)*0.5 pivot
  for (let z = 0; z < count; z++) {
    const sl = slices[z];
    const liftY = Math.round(z * sp);
    for (let py = 0; py < bh; py++) {
      const dy = (py - (baseY - liftY)) / sq;
      for (let px = 0; px < bw; px++) {
        const dx = px - cx;
        const sx = Math.round(dx * ca + dy * sa + (w - 1) * 0.5);
        const sy = Math.round(-dx * sa + dy * ca + (h - 1) * 0.5);
        if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
          const si = (sy * w + sx) * 4;
          if (sl[si + 3] > 0) {
            const bi = (py * bw + px) * 4;
            body[bi] = sl[si];
            body[bi + 1] = sl[si + 1];
            body[bi + 2] = sl[si + 2];
            body[bi + 3] = 255;
          }
        }
      }
    }
  }

  // 1px outer silhouette outline once around finished stack
  for (let py = 1; py < bh - 1; py++) {
    for (let px = 1; px < bw - 1; px++) {
      const idx = (py * bw + px) * 4;
      if (body[idx + 3] > 0) {
        out[idx] = body[idx];
        out[idx + 1] = body[idx + 1];
        out[idx + 2] = body[idx + 2];
        out[idx + 3] = 255;
      } else if (
        body[((py - 1) * bw + px) * 4 + 3] > 0 ||
        body[((py + 1) * bw + px) * 4 + 3] > 0 ||
        body[(py * bw + (px - 1)) * 4 + 3] > 0 ||
        body[(py * bw + (px + 1)) * 4 + 3] > 0
      ) {
        out[idx] = 24; out[idx + 1] = 28; out[idx + 2] = 36; out[idx + 3] = 255;
      }
    }
  }

  const bufCanvas = document.createElement("canvas");
  bufCanvas.width = bw;
  bufCanvas.height = bh;
  bufCanvas.getContext("2d").putImageData(new ImageData(out, bw, bh), 0, 0);
  return bufCanvas;
}

async function init() {
  for (const st of STYLES) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div>
        <h2>${st.name}</h2>
        <p class="meta">${st.subtitle}</p>
      </div>
      <div class="stage-wrap" style="background:${st.swatchBg}">
        <canvas width="420" height="320"></canvas>
      </div>
      <div class="sheets">
        <div class="sheet-box">
          <span>Villager 4-View Sheet (${st.villager.w}x${st.villager.h}x${st.villager.slices})</span>
          <img src="${st.villager.viewsSrc}" alt="Villager 4-view" />
        </div>
        <div class="sheet-box">
          <span>Tree 4-View Sheet (${st.tree.w}x${st.tree.h}x${st.tree.slices})</span>
          <img src="${st.tree.viewsSrc}" alt="Tree 4-view" />
        </div>
      </div>
    `;
    grid.appendChild(card);

    const canvas = card.querySelector("canvas");
    const vImg = await loadImage(st.villager.src);
    const tImg = await loadImage(st.tree.src);
    stages.push({
      st,
      canvas,
      ctx: canvas.getContext("2d"),
      vSlices: extractSlices(vImg, st.villager.slices, st.villager.w, st.villager.h),
      tSlices: extractSlices(tImg, st.tree.slices, st.tree.w, st.tree.h),
    });
  }
  requestAnimationFrame(loop);
}

function drawStage(item, rad) {
  const { st, canvas, ctx, vSlices, tSlices } = item;
  const W = canvas.width, H = canvas.height;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);

  // Diorama grass platform
  const pw = W - 64, ph = 116;
  const px = 32, py = H - ph - 22;
  ctx.fillStyle = st.grassDark;
  ctx.beginPath();
  ctx.roundRect(px, py + 10, pw, ph, 18);
  ctx.fill();

  ctx.fillStyle = st.grassMain;
  ctx.strokeStyle = "#181c24";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 18);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = st.grassLight;
  for (let gx = px + 24; gx < px + pw - 24; gx += 34) {
    for (let gy = py + 20; gy < py + ph - 20; gy += 26) {
      if (((gx + gy) & 1) === 0) ctx.fillRect(gx, gy, 10, 4);
    }
  }

  const scale = st.villager.slices >= 30 ? Math.max(2, zoom - 1) : zoom;
  const tBuf = renderStackToBuffer(tSlices, st.tree.w, st.tree.h, rad, squash, spacing);
  const vBuf = renderStackToBuffer(vSlices, st.villager.w, st.villager.h, rad, squash, spacing);

  const tW = tBuf.width * scale, tH = tBuf.height * scale;
  const vW = vBuf.width * scale, vH = vBuf.height * scale;

  ctx.drawImage(tBuf, Math.round(W * 0.35 - tW * 0.5), Math.round(py + ph * 0.72 - tH), tW, tH);
  ctx.drawImage(vBuf, Math.round(W * 0.68 - vW * 0.5), Math.round(py + ph * 0.78 - vH), vW, vH);
}

function loop() {
  if (playing) {
    angleDeg = (angleDeg + 0.6) % 360;
    document.getElementById("angleSlider").value = Math.round(angleDeg);
    document.getElementById("angleVal").textContent = Math.round(angleDeg) + "°";
  }
  const rad = angleDeg * Math.PI / 180;
  for (const item of stages) drawStage(item, rad);
  requestAnimationFrame(loop);
}

document.getElementById("togglePlay").addEventListener("click", (e) => {
  playing = !playing;
  e.target.textContent = playing ? "Pause" : "Play";
});
document.getElementById("angleSlider").addEventListener("input", (e) => {
  playing = false;
  document.getElementById("togglePlay").textContent = "Play";
  angleDeg = Number(e.target.value);
  document.getElementById("angleVal").textContent = angleDeg + "°";
});
document.getElementById("squashSlider").addEventListener("input", (e) => {
  squash = Number(e.target.value) / 100;
  document.getElementById("squashVal").textContent = squash.toFixed(2);
});
document.getElementById("spacingSlider").addEventListener("input", (e) => {
  spacing = Number(e.target.value) / 100;
  document.getElementById("spacingVal").textContent = spacing.toFixed(1) + "x";
});
document.getElementById("zoomSlider").addEventListener("input", (e) => {
  zoom = Number(e.target.value);
  document.getElementById("zoomVal").textContent = zoom + "x";
});

init();
</script>
