<style>

    --text: #eef2f8;
    --muted: #a6b4cc;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 24px;

    color: var(--text);

    gap: 14px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);

  .sub { margin: 4px 0 0; font-size: 0.86rem; color: var(--muted); }

    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    background: var(--card);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
  button {
    background: #2f3b56;
    color: var(--text);
    border: 1px solid #52638a;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card h3 { margin: 0; font-size: 0.95rem; color: var(--accent); }
  .card .meta { margin: 0; font-size: 0.75rem; color: var(--muted); }
  canvas {
    width: 100%;
    height: 180px;
    background: #569c6c;
    border-radius: 8px;
    border: 2px solid #181c24;
    image-rendering: pixelated;
  }
</style>

let playing = false;
let angleDeg = 60;
let squash = 0.55;
let spacing = 0.8;
let zoom = 6;
const cards = [];

function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

function extractSlices(img, count, w, h) {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const out = [];
  for (let z = 0; z < count; z++) out.push(ctx.getImageData(z * w, 0, w, h).data);
  return out;
}

function renderStack(slices, w, h, rad, sq, sp) {
  const count = slices.length;
  const diag = Math.ceil(Math.hypot(w, h)) + 8;
  const liftMax = Math.ceil((count - 1) * sp);
  const bw = diag + 12;
  const bh = Math.ceil(diag * sq) + liftMax + 16;
  const cx = bw >> 1;
  const baseY = bh - Math.ceil(diag * sq * 0.5) - 6;
  const ca = Math.cos(rad), sa = Math.sin(rad);
  const body = new Uint8ClampedArray(bw * bh * 4);
  const out = new Uint8ClampedArray(bw * bh * 4);

  for (let z = 0; z < count; z++) {
    const sl = slices[z];
    const liftY = Math.round(z * sp);
    for (let py = 0; py < bh; py++) {
      const dy = (py - (baseY - liftY)) / sq;
      for (let px = 0; px < bw; px++) {
        const dx = px - cx;
        const sx = Math.round(dx * ca + dy * sa + (w - 1) * 0.5);
        const sy = Math.round(-dx * sa + dy * ca + (h - 1) * 0.5);
        if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
          const si = (sy * w + sx) * 4;
          if (sl[si + 3] > 0) {
            const bi = (py * bw + px) * 4;
            body[bi] = sl[si]; body[bi+1] = sl[si+1]; body[bi+2] = sl[si+2]; body[bi+3] = 255;
          }
        }
      }
    }
  }
  for (let py = 1; py < bh - 1; py++) {
    for (let px = 1; px < bw - 1; px++) {
      const i = (py * bw + px) * 4;
      if (body[i + 3] > 0) {
        out[i] = body[i]; out[i+1] = body[i+1]; out[i+2] = body[i+2]; out[i+3] = 255;
      } else if (
        body[((py-1)*bw+px)*4+3] > 0 || body[((py+1)*bw+px)*4+3] > 0 ||
        body[(py*bw+(px-1))*4+3] > 0 || body[(py*bw+(px+1))*4+3] > 0
      ) {
        out[i] = 24; out[i+1] = 28; out[i+2] = 36; out[i+3] = 255;
      }
    }
  }
  const c = document.createElement("canvas");
  c.width = bw; c.height = bh;
  c.getContext("2d").putImageData(new ImageData(out, bw, bh), 0, 0);
  return c;
}

async function init() {
  const grid = document.getElementById("grid");
  for (const item of ITEMS) {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <canvas width="220" height="180"></canvas>
      <h3>${item.title}</h3>
      <p class="meta">${item.file} • ${item.w}x${item.h}x${item.slices} • tile ${item.footprint.join("x")}</p>
    `;
    grid.appendChild(el);
    const img = await loadImage(item.src);
    const canvas = el.querySelector("canvas");
    cards.push({
      item,
      canvas,
      ctx: canvas.getContext("2d"),
      slices: extractSlices(img, item.slices, item.w, item.h),
    });
  }
  requestAnimationFrame(loop);
}

function loop() {
  if (playing) {
    angleDeg = (angleDeg + 0.75) % 360;
    document.getElementById("angleSlider").value = Math.round(angleDeg);
    document.getElementById("angleVal").textContent = Math.round(angleDeg) + "°";
  }
  const rad = angleDeg * Math.PI / 180;
  for (const c of cards) {
    const { item, canvas, ctx, slices } = c;
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const buf = renderStack(slices, item.w, item.h, rad, squash, spacing);
    let sc = item.w >= 28 ? Math.max(2, zoom - 3) : (item.slices >= 28 ? Math.max(2, zoom - 2) : Math.max(2, zoom - 1));
    const dw = buf.width * sc, dh = buf.height * sc;
    ctx.drawImage(buf, Math.round((canvas.width - dw) * 0.5), Math.round((canvas.height - dh) * 0.5 + 8), dw, dh);
  }
  requestAnimationFrame(loop);
}

document.getElementById("togglePlay").addEventListener("click", (e) => {
  playing = !playing;
  e.target.textContent = playing ? "Pause" : "Rotate 360°";
});
document.getElementById("angleSlider").addEventListener("input", (e) => {
  playing = false;
  document.getElementById("togglePlay").textContent = "Rotate 360°";
  angleDeg = Number(e.target.value);
  document.getElementById("angleVal").textContent = angleDeg + "°";
});
document.getElementById("squashSlider").addEventListener("input", (e) => {
  squash = Number(e.target.value) / 100;
  document.getElementById("squashVal").textContent = squash.toFixed(2);
});
document.getElementById("spacingSlider").addEventListener("input", (e) => {
  spacing = Number(e.target.value) / 100;
  document.getElementById("spacingVal").textContent = spacing.toFixed(2) + "x";
});
document.getElementById("zoomSlider").addEventListener("input", (e) => {
  zoom = Number(e.target.value);
  document.getElementById("zoomVal").textContent = zoom + "x";
});

init();
</script>
