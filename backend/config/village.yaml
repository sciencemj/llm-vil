# 은빛골 (Eunbit Valley) — Phase 1 demo village.
# Coordinates are tile (x, y); x grows east, y grows south. Grid is 32 x 24.
name: 은빛골
language: ko
seed: 42
width: 32
height: 24
ticks_per_day: 1440          # 1 tick = 1 sim minute
start_minute: 300            # 05:00 on day 0, everyone still asleep
perception_radius: 6

clock:
  sim_minutes_per_real_second: 2.0
  t_max_seconds: 3.0

needs:
  hunger_per_min_awake: 0.045
  hunger_per_min_asleep: 0.015
  stamina_sleep_per_min: 0.25
  stamina_rest_per_min: 0.2
  hungry_threshold: 50
  tired_threshold: 25
  slow_hunger: 85            # at/above: work and walking take twice as long

economy:
  forest_reserve: 3          # chopping refused when mature trees <= reserve
  orders_per_day: 2
  order_templates:
    - {item: wood, min_qty: 2, max_qty: 4, reward_per_unit: 4}
    - {item: turnip, min_qty: 1, max_qty: 3, reward_per_unit: 5}
    - {item: berry, min_qty: 2, max_qty: 4, reward_per_unit: 2}
    - {item: wheat, min_qty: 1, max_qty: 2, reward_per_unit: 6}
  order_lifetime_days: 2
  merchant_every_days: 3
  merchant_open_minute: 480
  merchant_close_minute: 1080
  weather_weights: {sunny: 0.5, overcast: 0.25, rain: 0.25}

memory:
  hot_days: 3
  salient_importance: 7
  reflection_threshold: 120
  perception_cooldown: 60
  retrieve_k: 6

conversation:
  max_turns: 6
  ticks_per_turn: 2

items:
  coins: {}
  wood: {sell: 2}
  berry: {food: 10, sell: 1}
  turnip: {food: 25, sell: 3}
  wheat: {sell: 4}
  turnip_seed: {buy: 2}
  wheat_seed: {buy: 3}
  berry_stew: {food: 55, stamina: 10}
  turnip_soup: {food: 60, stamina: 10}
  bread: {food: 45, buy: 6}

crops:
  turnip: {seed: turnip_seed, days: 2, yield_qty: 3, seed_min: 1, seed_max: 2}
  wheat: {seed: wheat_seed, days: 3, yield_qty: 3, seed_min: 1, seed_max: 2}

recipes:
  berry_stew: {inputs: {berry: 3}, fuel: {wood: 1}, output: berry_stew}
  turnip_soup: {inputs: {turnip: 2}, fuel: {wood: 1}, output: turnip_soup}
  bread: {inputs: {wheat: 2}, fuel: {wood: 1}, output: bread}

# Data-driven object affordances. Effects with special data (crops, chests, orders,
# trades, recipes) are resolved by the world from the sections above.
kinds:
  tree:
    initial_state: mature
    opaque: true
    growth: {stages: [stump, sapling, young, mature], days: [1, 1, 2, 0]}
    affordances:
      chop: {from_states: [mature], to_state: stump, stamina_cost: 8, duration: 20,
             yields: {wood: 3}, yields_bonus: {wood: 1}}
  farm_plot:
    initial_state: untilled
    blocking: false
    affordances:
      till: {from_states: [untilled], to_state: tilled, stamina_cost: 4, duration: 10}
      plant: {from_states: [tilled], to_state: planted, stamina_cost: 1, duration: 5}
      water: {from_states: [planted], to_state: watered, stamina_cost: 1, duration: 4}
      harvest: {from_states: [ready], to_state: tilled, stamina_cost: 2, duration: 6}
  berry_bush:
    initial_state: ripe
    growth: {stages: [empty, ripe], days: [2, 0]}   # wild bushes always regrow
    affordances:
      forage: {from_states: [ripe], to_state: empty, stamina_cost: 2, duration: 8,
               yields: {berry: 3}, yields_bonus: {berry: 2}}
  hearth:
    initial_state: idle
    affordances:
      cook: {stamina_cost: 1, duration: 25}
  bed:
    initial_state: made
    affordances:
      sleep: {duration: 1}
  chest:
    initial_state: closed
    affordances:
      store: {duration: 2}
      take: {duration: 2}
  notice_board:
    initial_state: posted
    affordances:
      fulfill_order: {duration: 3}
  trading_stall:
    initial_state: idle          # merchant_open while the traveling merchant is in town
    affordances:
      trade: {duration: 4}
  well:
    initial_state: idle
    affordances: {}

water:                        # impassable pond tiles [x, y, w, h]
  - [22, 13, 5, 4]

areas:
  - {id: forest, name: 북쪽 숲, rect: [1, 0, 30, 7]}
  - {id: farm, name: 마을 밭, rect: [5, 12, 7, 4]}
  - {id: plaza, name: 마을 광장, rect: [12, 17, 9, 6]}
  - {id: pond, name: 연못가, rect: [20, 12, 8, 6]}
  - {id: kitchen, name: 공동 부엌, rect: [12, 12, 4, 3]}
  - {id: home_mina, name: 민아네 오두막, rect: [3, 7, 4, 4]}
